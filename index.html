<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.login.css">
    <link rel="stylesheet" href="css/estilos.globales.css">
    <title>Login</title>
</head>

<body>
    <form class="CajaPrincipal">
        <h2>Login</h2>
        <div class="SubCaja">
            <label for="usuario">Usuario:</label>
            <input class="Ctexto" name="Usuario" id="usuario" placeholder="DNI" type="text" required maxlength="8">
            <label for="txtclave">Contraseña:</label>
            <input type="password" class="Ctexto" name="Contraseña" id="txtclave" placeholder="Contraseña" required>
            <button type="submit" class="btnG">Ingresar</button>
        </div>
    </form>
    <script type="module" src="js/login.js"></script>
</body>


</html>
